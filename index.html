<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando contenido...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 40px 20px; background: #121212; color: white; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #fe2c55; animation: spin 1s linear infinite; margin: 30px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background: #fe2c55; color: white; padding: 12px 24px; text-decoration: none; border-radius: 25px; font-weight: bold; display: inline-block; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>Procesando tu solicitud...</h2>
    <div class="spinner"></div>
    <p id="mensaje">Detectando dispositivo y redirigiendo...</p>
    
    <a href="#" class="btn" id="boton-manual" style="display:none;">Ir a TikTok manualmente</a>

    <script>
        // CONFIGURACIÓN EDITABLE:
        const USUARIO_TIKTOK = "pittersv_"; // Ya configurado con el inicio de tu usuario de la imagen
        const DESTINO_FINAL = "https://vt.tiktok.com/ZSqsXgYgd/"; // CAMBIA ESTO por la página final que quieres que vean

        // DETECTOR DE DISPOSITIVOS
        const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const boton = document.getElementById('boton-manual');
        const mensaje = document.getElementById('mensaje');
        let urlTikTok = "";

        if (esMovil) {
            urlTikTok = snssdk1233://user/profile/${USUARIO_TIKTOK};
            mensaje.innerText = "Abriendo TikTok en tu teléfono...";
        } else {
            urlTikTok = https://tiktok.com{USUARIO_TIKTOK};
            mensaje.innerText = "Abriendo TikTok en el navegador...";
        }

        boton.href = urlTikTok;
        boton.style.display = "inline-block";

        // EJECUCIÓN
        window.location.href = urlTikTok;

        setTimeout(function() {
            window.location.href = DESTINO_FINAL;
        }, 3000); // 3 segundos de espera antes de la redirección definitiva
    </script>

</body>
</html>
