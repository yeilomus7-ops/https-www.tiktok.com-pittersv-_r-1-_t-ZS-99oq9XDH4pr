|<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consola de Diagnóstico Avanzada</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background: #0a0a0a; color: #00ff00; padding: 20px; text-align: left; }
        .console-box { border: 1px solid #00ff00; padding: 20px; background: #111; max-width: 600px; margin: 0 auto; border-radius: 5px; box-shadow: 0 0 15px rgba(0, 255, 0, 0.2); }
        h2 { text-align: center; color: #fff; margin-top: 0; }
        .data-line { margin: 10px 0; font-size: 14px; }
        .label { color: #888; }
        .btn-action { display: block; width: 100%; text-align: center; background: #00ff00; color: #000; padding: 12px; font-weight: bold; border: none; border-radius: 3px; cursor: pointer; margin-top: 20px; text-decoration: none; }
    </style>
</head>
<body>

    <div class="console-box">
        <h2>SISTEMA DE DIAGNÓSTICO</h2>
        <div class="data-line"><span class="label">[SISTEMA]:</span> <span id="os-info">No disponible por privacidad</span></div>
        <div class="data-line"><span class="label">[NÚCLEOS CPU]:</span> <span id="cpu-info">Protegido por el sistema</span></div>
        <div class="data-line"><span class="label">[MEMORIA RAM APPROX]:</span> <span id="ram-info">Bloqueado por navegador</span></div>
        <div class="data-line"><span class="label">[ESTADO RED]:</span> <span id="net-info">ONLINE</span></div>
        <div class="data-line"><span class="label">[BATERÍA]:</span> <span id="battery-info">No permitido en este cel</span></div>
        
        <button class="btn-action" id="btn-permiso">SOLICITAR GEOLOCALIZACIÓN NATIVA</button>
    </div>

    <script>
        // Intentar leer datos de hardware, si el celular lo bloquea, se salta el error sin congelar la pantalla
        try {
            document.getElementById('os-info').innerText = navigator.userAgentData ? navigator.userAgentData.platform : navigator.platform;
            document.getElementById('cpu-info').innerText = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " Núcleos" : "Protegido";
            document.getElementById('ram-info').innerText = navigator.deviceMemory ? navigator.deviceMemory + " GB aproximados" : "Bloqueado";
        } catch(e) {
            console.log("Lectura automática bloqueada por seguridad del móvil.");
        }

        // Estado de Red nativo
        try {
            document.getElementById('net-info').innerText = navigator.onLine ? "CONECTADO (ONLINE)" : "DESCONECTADO (OFFLINE)";
        } catch(e) {}

        // Intentar leer la batería con soporte seguro
        if (navigator.getBattery) {
            navigator.getBattery().then(function(battery) {
                function actualizarBateria() {
                    const nivel = Math.round(battery.level * 100) + "%";
                    const cargando = battery.charging ? " (Conectado)" : " (Desconectado)";
                    document.getElementById('battery-info').innerText = nivel + cargando;
                }
                actualizarBateria();
            }).catch(function() {
                document.getElementById('battery-info').innerText = "Bloqueado por restricciones del celular";
            });
        }

        // Solicitud Estándar de Ubicación (Esta siempre salta el aviso si el usuario da clic voluntariamente)
        document.getElementById('btn-permiso').addEventListener('click', function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        alert(Coordenadas obtenidas legítimamente:\nLatitud: ${position.coords.latitude}\nLongitud: ${position.coords.longitude});},
                    function(error) {
                        alert("Aviso Ético: Permiso denegado por el usuario o bloqueado por la seguridad de tu dispositivo.");
                    }
                );
            } else {
                alert("Geolocalización no soportada en este navegador.");
            }
        });
    </script>

</body>
</html>
