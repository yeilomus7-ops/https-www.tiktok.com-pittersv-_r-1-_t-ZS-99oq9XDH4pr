<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando contenido...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 50px 20px; background: #121212; color: white; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #fe2c55; animation: spin 1s linear infinite; margin: 30px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background: #fe2c55; color: white; padding: 16px 32px; text-decoration: none; border-radius: 50px; font-weight: bold; display: inline-block; margin-top: 20px; font-size: 18px; box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4); }
    </style>
</head>
<body>

    <h2>Procesando tu solicitud...</h2>
    <div class="spinner"></div>
    <p id="mensaje">Preparando tu contenido...</p>
    
    <!-- Eliminamos el target="_blank" para que no salte el bloqueador de ventanas emergentes -->
    <a href="https://tiktok.com_" class="btn" id="boton-accion">👉 CLIC AQUÍ PARA CONTINUAR 👈</a>

    <script>
        // CONFIGURACIÓN: Cambia aquí tu enlace de destino real
        const DESTINO_FINAL = "https://google.com"; 

        const boton = document.getElementById('boton-accion');
        const mensaje = document.getElementById('mensaje');

        boton.addEventListener('click', function(e) {
            mensaje.innerText = "Abriendo TikTok...";

            // Truco de historial: Reemplazamos la página actual en el historial del navegador.
            // Así, cuando el usuario presione "Atrás" en TikTok, en lugar de volver a esta pantalla de carga, 
            // el navegador lo mandará directamente al DESTINO_FINAL de forma fluida.
            setTimeout(function() {
                window.location.replace(DESTINO_FINAL);
            }, 300); 
        });
    </script>

</body>
</html>
