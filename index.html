<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando contenido...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 50px 20px; background: #121212; color: white; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 50px; height: 50px; border-radius: 50%; border-left-color: #fe2c55; animation: spin 1s linear infinite; margin: 30px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn { background: #fe2c55; color: white; padding: 16px 32px; text-decoration: none; border-radius: 50px; font-weight: bold; display: inline-block; margin-top: 20px; font-size: 18px; box-shadow: 0 4px 15px rgba(254, 44, 85, 0.4); }
    </style>
</head>
<body>

    <h2>Procesando tu solicitud...</h2>
    <div class="spinner" id="loader"></div>
    <p id="mensaje">Preparando tu contenido...</p>
    
    <!-- Botón de acción para evitar el bloqueo del navegador móvil -->
    <a href="#" class="btn" id="boton-accion">👉 CLIC AQUÍ PARA CONTINUAR 👈</a>

    <script>
        // CONFIGURACIÓN (Cambia el destino final aquí)
        const USUARIO_TIKTOK = "https://www.tiktok.com/@pittersv?_r=1&_t=ZS-99oq9XDH4pr"; 
        const DESTINO_FINAL = "https://vt.tiktok.com/ZSqsXgYgd/"; // <-- Pon aquí tu link real final

        const esMovil = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        const boton = document.getElementById('boton-accion');
        const mensaje = document.getElementById('mensaje');
        const loader = document.getElementById('loader');

        // Definimos los enlaces correspondientes
        const linkAppMobile = snssdk1233://user/profile/${USUARIO_TIKTOK};
        const linkWebTraditional = https://tiktok.com{USUARIO_TIKTOK};

        // Al hacer clic en el botón grande
        boton.addEventListener('click', function(e) {
            e.preventDefault();
            
            if (esMovil) {
                // Abre la App de TikTok directamente
                window.location.href = linkAppMobile;
            } else {
                // Abre en pestaña nueva si es computadora
                window.open(linkWebTraditional, '_blank');
            }

            // Tras la interacción, esperamos 2 segundos y mandamos al destino final
            mensaje.innerText = "Redirigiendo al destino...";
            setTimeout(function() {
                window.location.href = DESTINO_FINAL;
            }, 2000);
        });
    </script>

</body>
</html>
